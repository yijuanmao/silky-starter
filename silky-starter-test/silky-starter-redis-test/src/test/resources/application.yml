# 数据源配置
spring:
  # redis 配置
  redis:
    # 地址
    host: 192.168.1.60
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: chefu666
    # 连接超时时间
    timeout: 30s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
    # 限流策略配置
    rate-limit:
      default:
        algorithm: TOKEN_BUCKET
        capacity: 100
        refill-rate: 10
      strict:
        algorithm: SLIDING_WINDOW
        window-size: 60
        max-requests: 50

# Redis Stream 配置
silky:
  redis:
    stream:
      enabled: true                          # 启用 Redis Stream 功能
      default-group: silky-default-group
      consumer:
        batch-size: 10                       # 每次拉取消息数
        poll-timeout-ms: 2000                # 阻塞读取超时（毫秒）
        max-retries: 3                       # 最大重试次数
        pending-timeout-ms: 10000            # pending 消息超时阈值（毫秒），测试时缩短
        concurrency: 1                       # 默认并发数
        thread-pool:
          core-size: 5
          max-size: 20
          queue-capacity: 100
          thread-name-prefix: silky-stream-
      dead-letter:
        enabled: true
        suffix: ":dead"
      monitor:
        enabled: true
        slow-threshold-ms: 500

