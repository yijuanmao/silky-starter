silky:
  excel:
    enabled: true
    async:
      thread-pool:
        core-pool-size: 10
        max-pool-size: 50
        queue-capacity: 1000
        keep-alive-seconds: 60
    export:
      page-size: 100
      timeout-minutes: 30
      max-rows-per-sheet: 100000
      progress-enabled: true
    imports:
      page-size: 100
      max-error-count: 100
      timeout-minutes: 30
      head-row-number: 1
    storage:
      type: local
      local:
        base-path: ${java.io.tmpdir}/silky-excel-test
